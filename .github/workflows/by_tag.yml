name: Build PySide6 App

on:
  push:
    tags:
      - "release-v*"

env:
  APP_NAME: passmgr
  MAIN_FILE: passmgr.py

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka==2.7.16

      - name: Build app
        if: runner.os != 'Windows'
        run: |
          python -m nuitka --standalone --onefile --output-dir=dist $MAIN_FILE
      
      - name: Build app windows
        if: runner.os == 'Windows'
        run: |
          python -m nuitka --standalone --onefile --output-dir=dist $env:MAIN_FILE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ env.APP_NAME }}
          path: dist/*

